priv:[["1. Who we are","Falcon 29 LLC (\"Falcon 29\", \"we\", \"our\", \"us\") is a limited liability company registered in the State of New Mexico, USA, and is the data controller for the personal data described in this policy. This policy applies to our website, mobile applications and games (together, the \"Services\")."],["2. Categories of data we process","Data you provide: the content you create inside an app (tasks, routines, save files, settings) and any information you include when you contact support, such as your email address and message. Data collected automatically: device model, operating system version, app version, language and region, crash stack traces, aggregated feature-usage counters, and — in ad-supported products — your device advertising identifier, IP address and ad interaction events (see section 5). Data from platforms: purchase validation receipts and subscription status supplied by Apple, Google or Valve. We do not process special-category data, precise geolocation, contacts, photos, microphone or camera data unless a specific feature requires it and you grant permission."],["3. Local-first architecture","Our applications and games operate primarily on a local-storage architecture. Content you create is stored on your device and is not transmitted to us unless you explicitly enable a sync or cloud feature. Where local-network sync is offered, data travels directly between your own devices and does not pass through our servers. Ad-supported products additionally require a network connection to request advertisements from our advertising partners."],["4. Purposes and legal bases","We process data to provide and maintain the Services (performance of a contract), to diagnose crashes and improve stability and performance (legitimate interests), to respond to support requests (legitimate interests or performance of a contract), to process and validate purchases (performance of a contract), and to comply with legal obligations. Where we rely on consent, for example for optional analytics, you may withdraw it at any time in the app settings without affecting the lawfulness of prior processing."],["5. Advertising and identifiers","Some of our products are free and ad-supported. In those products, advertisements are delivered by third-party advertising networks whose SDKs may process your device advertising identifier (IDFA on iOS, Advertising ID on Android), IP address, approximate region derived from the IP address, device and app information, and ad interaction events such as impressions and clicks. On iOS we present Apple's App Tracking Transparency prompt before any tracking identifier is used; if you decline, only contextual, non-personalised advertising is shown. In the EEA, the UK and T\u00fcrkiye we request consent through a consent management platform before personalised advertising is enabled, and you can change that choice at any time in the app's privacy settings. Under the CCPA/CPRA, the use of advertising identifiers for personalised ads may qualify as \"sharing\" for cross-context behavioural advertising; California residents can opt out using the \"Do Not Sell or Share My Personal Information\" control in the app settings or by emailing us. We do not sell personal information for money. Where a product offers an ad-free purchase or subscription, advertising is disabled once the purchase is validated."],["6. Third-party processors","We rely on a limited set of providers acting on our behalf or as independent controllers: Apple (App Store, In-App Purchase, Game Center, CloudKit), Google (Google Play, Play Billing, Play Integrity), Valve (Steam), advertising and monetisation partners such as Google AdMob or Ad Manager, Unity Ads and AppLovin, and crash-reporting and hosting providers. Advertising partners act as independent controllers for the data collected through their SDKs, and their own privacy policies govern that processing. Their processing is governed by their own privacy policies. We enter into data-processing agreements with our processors where required by law."],["7. International transfers","Our operations and some providers are located in the United States. Where personal data of users in the European Economic Area, the United Kingdom, Switzerland or Türkiye is transferred outside those jurisdictions, we rely on Standard Contractual Clauses or an equivalent lawful transfer mechanism, together with supplementary technical measures such as encryption in transit."],["8. Retention","Support correspondence is retained for up to 24 months after the request is closed. Diagnostic and crash data is retained for up to 12 months in aggregated or anonymised form. Purchase records are retained for the period required by tax and accounting law. Locally stored content is retained on your device until you delete it or uninstall the app."],["9. Your rights","Subject to applicable law, including the GDPR, the UK GDPR, the CCPA/CPRA and the Turkish Personal Data Protection Law (KVKK No. 6698), you may request access to your personal data, correction of inaccurate data, erasure, restriction of or objection to processing, portability in a machine-readable format, and withdrawal of consent. Requests can be sent to contact@falcon29.com and are answered within 30 days, free of charge. You also have the right to lodge a complaint with your local supervisory authority."],["10. Security","We apply reasonable technical and organisational measures, including TLS encryption in transit, access controls on administrative systems, and minimisation of the data we collect. No method of transmission or storage is completely secure, and we cannot guarantee absolute security. In the event of a personal data breach likely to result in a risk to your rights, we will notify the competent authority and, where required, affected users without undue delay."],["11. Children","Our products are not directed to children under 13 (or under 16 where local law sets a higher age), and we do not knowingly collect personal data from them. Where an app is listed in a children's category or is directed to mixed audiences, we disable personalised advertising and instruct our advertising partners to serve only non-personalised, age-appropriate ads, in line with COPPA, the GDPR and store policies. If you believe a child has provided us personal data, contact us and we will delete it promptly."],["12. Cookies and website analytics","This website uses only strictly necessary storage required to remember your language preference. We do not use advertising or tracking cookies on this site."],["13. Changes to this policy","We may update this policy to reflect changes in our products or in applicable law. Material changes will be published on this page with a new effective date and, where required, announced in-app before taking effect."],["14. Contact","Privacy questions and rights requests: contact@falcon29.com. Postal correspondence can be requested by email."]],
term:[["1. Acceptance","These Terms of Use form a binding agreement between you and Falcon 29 LLC governing your use of our website, applications and games. By downloading, installing or using the Services you accept these terms. If you do not accept them, do not use the Services."],["2. Licence","Subject to your compliance with these terms, Falcon 29 LLC grants you a personal, limited, non-exclusive, non-transferable and revocable licence to install and use our products for your own non-commercial purposes, in accordance with the rules of the store from which you obtained them. No ownership rights are transferred."],["3. Restrictions","You may not reverse engineer, decompile, disassemble, modify, translate or create derivative works of our software, except to the extent such restriction is prohibited by applicable law; distribute, rent, lease, sublicense, resell or commercially exploit the Services; circumvent technical protection or licensing measures; use cheats, bots, automation or exploits that affect fairness or stability; or use the Services in a way that violates law or infringes third-party rights."],["4. User content","You retain ownership of content you create with our products. Where a feature lets you submit content to us or make it publicly available, you grant Falcon 29 LLC a worldwide, non-exclusive, royalty-free licence to host, reproduce and display that content solely to operate and improve the feature. You are responsible for ensuring you hold the rights to any content you submit."],["5. Purchases, subscriptions and virtual items","All purchases are processed by the distributing platform (Apple, Google or Valve) and are subject to that platform's terms and refund policy. Virtual items and in-game currency are licensed, not sold, have no monetary value outside the product, and cannot be exchanged for cash. Subscriptions renew automatically until cancelled in your platform account settings. Where a product offers an ad-free upgrade, that purchase removes advertising for the account or device on which it was validated."],["6. Refunds","Because payment is handled by the stores, refund requests must be submitted to Apple, Google or Valve. Where mandatory consumer law grants you a statutory right of withdrawal, that right is unaffected by these terms."],["7. Availability and updates","We may modify, suspend or discontinue any part of the Services, including online features, with reasonable notice where practicable. We may release updates that are required for continued use. Offline functionality of a purchased product will continue to work on supported devices."],["8. Intellectual property","All software, artwork, audio, trademarks, names and designs in the Services are owned by Falcon 29 LLC or its licensors and are protected by copyright and trademark law. Nothing in these terms grants you rights to our branding."],["9. Disclaimer of warranties","The Services are provided \"as is\" and \"as available\" without warranties of any kind, whether express, implied or statutory, including merchantability, fitness for a particular purpose and non-infringement. Some jurisdictions do not allow such exclusions, in which case they apply to the maximum extent permitted."],["10. Limitation of liability","To the maximum extent permitted by law, Falcon 29 LLC is not liable for indirect, incidental, special, consequential or punitive damages, or for loss of data, profits or goodwill. Our aggregate liability arising out of the Services is limited to the amount you paid for the relevant product in the twelve months preceding the claim. Nothing limits liability that cannot lawfully be limited, such as liability for fraud, gross negligence, or death or personal injury caused by negligence."],["11. Indemnity","You agree to indemnify and hold Falcon 29 LLC harmless from claims, damages and reasonable legal costs arising from your breach of these terms or your unlawful use of the Services."],["12. Termination","We may suspend or terminate your licence if you materially breach these terms. You may terminate at any time by ceasing use and uninstalling the products. Sections that by their nature survive termination, including intellectual property, disclaimers, limitation of liability and governing law, remain in effect."],["13. Governing law and disputes","These terms are governed by the laws of the State of New Mexico, USA, excluding its conflict-of-law rules. Disputes are subject to the exclusive jurisdiction of the state and federal courts located in New Mexico. If you are a consumer resident in the EEA, the UK or Türkiye, you retain the protection of the mandatory consumer provisions and the right to bring proceedings in the courts of your place of residence."],["14. Changes and contact","We may amend these terms; the current version is always published on this page with its effective date. Continued use after the effective date constitutes acceptance. Questions: contact@falcon29.com."]]};

cards:[["FT","Verimlilik Uygulaması","FractalTask","Flutter ile geliştirilen; yerel ağ senkronizasyonuna ve dikkat dağıtmayan görev mimarisine odaklanan modern iş akışı ve rutin yönetimi uygulaması.","Geliştiriliyor","iOS • Android",["Flutter","Çevrimdışı öncelikli","Yerel senkron"]],["TL","Bağımsız Mobil Oyun","Tilt","Sezgisel dokunma fiziği, uyarlanabilir zorluk ve modern mobil oynanış döngüleriyle tasarlanmış minimalist 2D sayı birleştirme bulmacası.","Geliştiriliyor","iOS • Android",["Bulmaca","Tek oyunculu","Reklam destekli"]],["BA","Strateji Oyunu","Bidder Arena","Godot Engine ile geliştirilen; stratejik teklif verme dinamiklerini algoritmik savaş sistemleriyle birleştiren çevrimdışı taktiksel auto-battler.","Prototip","PC • Mobil",["Godot","Çevrimdışı","Auto-battler"]]],
priv:[["1. Kim olduğumuz","Falcon 29 LLC (\"Falcon 29\", \"biz\"), ABD'nin New Mexico eyaletinde kayıtlı bir limited şirkettir ve bu politikada tanımlanan kişisel veriler bakımından veri sorumlusudur. Politika; web sitemiz, mobil uygulamalarımız ve oyunlarımız (birlikte \"Hizmetler\") için geçerlidir."],["2. İşlenen veri kategorileri","Sizin sağladığınız veriler: uygulama içinde oluşturduğunuz içerik (görevler, rutinler, kayıt dosyaları, ayarlar) ve destek talebinde ilettiğiniz e-posta adresi ile mesaj içeriği. Otomatik toplanan veriler: cihaz modeli, işletim sistemi ve uygulama sürümü, dil/bölge, çökme kayıtları, toplulaştırılmış kullanım sayaçları ve reklam destekli ürünlerde cihaz reklam tanımlayıcınız, IP adresiniz ile reklam etkileşim olayları (bkz. 5. madde). Platformlardan gelen veriler: Apple, Google veya Valve tarafından sağlanan satın alma doğrulama makbuzları ve abonelik durumu. Özel nitelikli kişisel veri, hassas konum, rehber, fotoğraf, mikrofon veya kamera verisi; ilgili özellik gerektirmedikçe ve izin vermediğiniz sürece işlenmez."],["3. Yerel öncelikli mimari","Uygulama ve oyunlarımız esas olarak yerel depolama mimarisiyle çalışır. Oluşturduğunuz içerik cihazınızda saklanır ve bir senkronizasyon ya da bulut özelliğini açıkça etkinleştirmediğiniz sürece bize aktarılmaz. Yerel ağ senkronizasyonu sunulan yerlerde veri, doğrudan kendi cihazlarınız arasında akar ve sunucularımızdan geçmez. Reklam destekli ürünler ise reklam talep edebilmek için internet bağlantısı gerektirir."],["4. İşleme amaçları ve hukuki sebepler","Verileri; Hizmetleri sunmak ve sürdürmek (sözleşmenin ifası), çökmeleri teşhis edip kararlılık ve performansı iyileştirmek (meşru menfaat), destek taleplerini yanıtlamak, satın almaları doğrulamak (sözleşmenin ifası) ve hukuki yükümlülüklere uymak amacıyla işleriz. Açık rızaya dayandığımız hallerde (örneğin isteğe bağlı analitik), rızanızı uygulama ayarlarından dilediğiniz an geri çekebilirsiniz; bu, önceki işlemenin hukukiliğini etkilemez."],["5. Reklam ve tanımlayıcılar","Ürünlerimizin bir kısmı ücretsiz ve reklam desteklidir. Bu ürünlerde reklamlar üçüncü taraf reklam ağları tarafından sunulur; bu ağların SDK'leri cihaz reklam tanımlayıcınızı (iOS'ta IDFA, Android'de Reklam Kimliği), IP adresinizi, IP'den türetilen yaklaşık bölge bilgisini, cihaz ve uygulama bilgilerini ve gösterim/tıklama gibi reklam etkileşim olaylarını işleyebilir. iOS'ta herhangi bir izleme tanımlayıcısı kullanılmadan önce Apple'ın Uygulama İzleme Şeffaflığı (ATT) izni istenir; izin vermezseniz yalnızca bağlamsal, kişiselleştirilmemiş reklam gösterilir. AEA, Birleşik Krallık ve Türkiye'de kişiselleştirilmiş reklam etkinleştirilmeden önce bir onay yönetim platformu üzerinden açık rızanız alınır; bu tercihinizi uygulama içindeki gizlilik ayarlarından dilediğiniz an değiştirebilirsiniz. CCPA/CPRA kapsamında reklam tanımlayıcılarının kişiselleştirilmiş reklam için kullanılması bağlam ötesi davranışsal reklam amaçlı \"paylaşım\" sayılabilir; Kaliforniya sakinleri uygulama ayarlarındaki \"Do Not Sell or Share My Personal Information\" seçeneğiyle veya bize e-posta göndererek bunu kapatabilir. Kişisel bilgileri para karşılığı satmıyoruz. Bir üründe reklamsız satın alma veya abonelik sunuluyorsa, satın alma doğrulandıktan sonra reklamlar devre dışı bırakılır."],["6. Üçüncü taraf hizmet sağlayıcılar","Sınırlı sayıda sağlayıcıyla çalışırız: Apple (App Store, Uygulama İçi Satın Alma, Game Center, CloudKit), Google (Google Play, Play Billing, Play Integrity), Valve (Steam), Google AdMob/Ad Manager, Unity Ads ve AppLovin gibi reklam ve gelir ortakları ile çökme raporlama ve barındırma sağlayıcıları. Reklam ortakları, SDK'leri aracılığıyla topladıkları veriler bakımından bağımsız veri sorumlusu olarak hareket eder ve bu işleme kendi gizlilik politikalarına tabidir. Bu tarafların işleme faaliyetleri kendi gizlilik politikalarına tabidir. Mevzuatın gerektirdiği hallerde veri işleme sözleşmeleri akdedilir."],["7. Yurt dışına aktarım","Faaliyetlerimiz ve bazı sağlayıcılarımız ABD'dedir. AEA, Birleşik Krallık, İsviçre veya Türkiye'deki kullanıcıların kişisel verileri bu ülkeler dışına aktarıldığında; Standart Sözleşme Hükümleri veya eşdeğer bir hukuki aktarım mekanizması ile aktarım sırasında şifreleme gibi tamamlayıcı teknik tedbirlere dayanırız. KVKK kapsamında aktarım, ilgili mevzuatın öngördüğü şartlara uygun olarak gerçekleştirilir."],["8. Saklama süreleri","Destek yazışmaları, talep kapandıktan sonra en fazla 24 ay saklanır. Teşhis ve çökme verileri toplulaştırılmış veya anonim biçimde en fazla 12 ay saklanır. Satın alma kayıtları vergi ve muhasebe mevzuatının öngördüğü süre boyunca tutulur. Cihazınızda saklanan içerik, siz silene veya uygulamayı kaldırana kadar durur."],["9. Haklarınız","GDPR, UK GDPR, CCPA/CPRA ve 6698 sayılı KVKK dâhil ilgili mevzuat uyarınca; kişisel verilerinize erişme, yanlış verilerin düzeltilmesini isteme, silinmesini veya yok edilmesini talep etme, işlemenin kısıtlanmasını isteme veya işlemeye itiraz etme, verilerinizi makine tarafından okunabilir biçimde taşıma ve rızanızı geri çekme haklarına sahipsiniz. Talepler contact@falcon29.com adresine iletilebilir ve ücretsiz olarak 30 gün içinde yanıtlanır. Ayrıca yetkili denetim makamına (Türkiye'de Kişisel Verileri Koruma Kurulu'na) şikâyette bulunma hakkınız saklıdır."],["10. Güvenlik","Aktarımda TLS şifreleme, yönetim sistemlerinde erişim kontrolleri ve toplanan verinin asgariye indirilmesi dâhil makul teknik ve idari tedbirleri uygularız. Hiçbir aktarım veya depolama yöntemi tümüyle güvenli değildir ve mutlak güvenlik garanti edilemez. Haklarınız bakımından risk doğurabilecek bir veri ihlali halinde, yetkili makamı ve gerekli olduğunda etkilenen kullanıcıları gecikmeksizin bilgilendiririz."],["11. Çocukların gizliliği","Ürünlerimiz 13 yaşın (yerel mevzuatın daha yüksek yaş öngördüğü yerlerde 16 yaşın) altındaki çocuklara yönelik değildir ve onlardan bilerek kişisel veri toplamayız. Bir uygulama mağazada çocuk kategorisinde listeleniyorsa veya karma kitleye yönelikse, kişiselleştirilmiş reklamı devre dışı bırakır ve reklam ortaklarımıza yalnızca kişiselleştirilmemiş, yaşa uygun reklam sunmaları talimatını veririz (COPPA, GDPR ve mağaza politikalarına uygun olarak). Bir çocuğun bize kişisel veri sağladığını düşünüyorsanız bizimle iletişime geçin; veriyi derhal sileriz."],["12. Çerezler ve web sitesi analitiği","Bu web sitesi yalnızca dil tercihinizi hatırlamak için gereken zorunlu depolamayı kullanır. Sitede reklam veya izleme çerezi kullanılmaz."],["13. Politikadaki değişiklikler","Ürünlerimizdeki veya mevzuattaki değişiklikleri yansıtmak için bu politikayı güncelleyebiliriz. Esaslı değişiklikler yeni yürürlük tarihiyle bu sayfada yayımlanır ve gerekli hallerde yürürlüğe girmeden önce uygulama içinde duyurulur."],["14. İletişim","Gizlilik soruları ve hak talepleri: contact@falcon29.com. Posta yoluyla yazışma için e-posta ile talepte bulunabilirsiniz."]],
term:[["1. Kabul","Bu Kullanım Koşulları, web sitemizi, uygulamalarımızı ve oyunlarımızı kullanımınızı düzenleyen, sizinle Falcon 29 LLC arasında bağlayıcı bir sözleşmedir. Hizmetleri indirerek, kurarak veya kullanarak bu koşulları kabul etmiş olursunuz. Kabul etmiyorsanız Hizmetleri kullanmayınız."],["2. Lisans","Bu koşullara uymanız kaydıyla Falcon 29 LLC, ürünlerimizi ticari olmayan kişisel amaçlarla ve edindiğiniz mağazanın kurallarına uygun şekilde kurup kullanmanız için size kişisel, sınırlı, münhasır olmayan, devredilemez ve geri alınabilir bir lisans verir. Hiçbir mülkiyet hakkı devredilmez."],["3. Yasaklar","Yazılımımız üzerinde tersine mühendislik, kaynak koda dönüştürme, ayrıştırma, değiştirme veya türev eser oluşturma (ilgili mevzuatın bu kısıtlamayı yasakladığı ölçü hariç); Hizmetleri dağıtma, kiralama, alt lisanslama, yeniden satma veya ticari olarak sömürme; teknik koruma ve lisanslama önlemlerini aşma; adaleti veya kararlılığı etkileyen hile, bot, otomasyon ve açık kullanımı; Hizmetleri hukuka aykırı veya üçüncü kişilerin haklarını ihlal edecek şekilde kullanma yasaktır."],["4. Kullanıcı içeriği","Ürünlerimizle oluşturduğunuz içeriğin mülkiyeti sizde kalır. Bir özellik içeriğinizi bize göndermenize veya herkese açık hale getirmenize imkân tanıyorsa, yalnızca o özelliği işletmek ve iyileştirmek amacıyla Falcon 29 LLC'ye dünya çapında, münhasır olmayan, bedelsiz bir barındırma, çoğaltma ve görüntüleme lisansı vermiş olursunuz. Gönderdiğiniz içeriğe ilişkin haklara sahip olmak sizin sorumluluğunuzdadır."],["5. Satın almalar, abonelikler ve sanal öğeler","Tüm satın almalar dağıtım platformu (Apple, Google veya Valve) tarafından işlenir ve ilgili platformun koşulları ile iade politikasına tabidir. Sanal öğeler ve oyun içi para satılmaz, lisanslanır; ürün dışında parasal değeri yoktur ve nakde çevrilemez. Abonelikler, platform hesabı ayarlarından iptal edilene kadar otomatik yenilenir. Bir üründe reklamsız yükseltme sunuluyorsa, bu satın alma doğrulandığı hesap veya cihazda reklamları kaldırır."],["6. İadeler","Ödeme mağazalar tarafından yönetildiğinden iade talepleri Apple, Google veya Valve'a iletilmelidir. Emredici tüketici mevzuatının size cayma hakkı tanıdığı hallerde bu hak saklıdır; işbu koşullar bu hakkı sınırlamaz."],["7. Erişilebilirlik ve güncellemeler","Hizmetlerin herhangi bir bölümünü, çevrimiçi özellikler dâhil, mümkün olduğunda makul bildirimle değiştirebilir, askıya alabilir veya sonlandırabiliriz. Kullanımın sürmesi için gerekli güncellemeler yayımlanabilir. Satın alınan bir ürünün çevrimdışı işlevleri desteklenen cihazlarda çalışmaya devam eder."],["8. Fikri mülkiyet","Hizmetlerdeki tüm yazılım, görsel, ses, marka, isim ve tasarımlar Falcon 29 LLC'ye veya lisans verenlerine aittir; telif hakkı ve marka mevzuatıyla korunur. Bu koşullar size markamıza ilişkin bir hak vermez."],["9. Garanti reddi","Hizmetler, açık, zımni veya kanuni hiçbir garanti verilmeksizin \"olduğu gibi\" ve \"mevcut haliyle\" sunulur; ticari elverişlilik, belirli bir amaca uygunluk ve ihlal etmeme garantileri dâhil. Bazı ülkelerde bu tür istisnalara izin verilmez; bu hallerde sınırlama mevzuatın izin verdiği azami ölçüde uygulanır."],["10. Sorumluluğun sınırlandırılması","Mevzuatın izin verdiği azami ölçüde Falcon 29 LLC; dolaylı, arızi, özel, netice kabilinden veya cezai zararlardan ya da veri, kâr veya itibar kaybından sorumlu değildir. Hizmetlerden doğan toplam sorumluluğumuz, talebin doğduğu tarihten önceki on iki ayda ilgili ürün için ödediğiniz tutarla sınırlıdır. Hile, ağır ihmal ya da ihmalden kaynaklanan ölüm veya bedensel zarar gibi hukuken sınırlanamayan sorumluluklar saklıdır."],["11. Tazminat","Bu koşulları ihlaliniz veya Hizmetleri hukuka aykırı kullanımınızdan doğan talepler, zararlar ve makul yasal masraflar bakımından Falcon 29 LLC'yi tazmin etmeyi ve zarardan korumayı kabul edersiniz."],["12. Fesih","Koşulları esaslı şekilde ihlal etmeniz halinde lisansınızı askıya alabilir veya sonlandırabiliriz. Siz de kullanımı bırakıp ürünleri kaldırarak dilediğiniz an sona erdirebilirsiniz. Fikri mülkiyet, garanti reddi, sorumluluk sınırlaması ve uygulanacak hukuk gibi nitelikleri gereği fesihten sonra da geçerli kalan hükümler yürürlükte kalır."],["13. Uygulanacak hukuk ve uyuşmazlıklar","Bu koşullar, kanunlar ihtilafı kuralları hariç olmak üzere ABD New Mexico eyaleti hukukuna tabidir. Uyuşmazlıklarda New Mexico'daki eyalet ve federal mahkemeler münhasıran yetkilidir. AEA, Birleşik Krallık veya Türkiye'de mukim tüketiciler, emredici tüketici hükümlerinin korumasından yararlanmaya ve yerleşim yerlerindeki mahkemelerde (Türkiye'de tüketici hakem heyetleri ve tüketici mahkemeleri dâhil) dava açmaya devam eder."],["14. Değişiklikler ve iletişim","Bu koşulları değiştirebiliriz; güncel sürüm yürürlük tarihiyle birlikte her zaman bu sayfada yayımlanır. Yürürlük tarihinden sonraki kullanım kabul anlamına gelir. Sorularınız için: contact@falcon29.com."]]})
};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(l){
  var d=T[l]||T.en, legalTr=(d.priv!==EN.priv);
  document.documentElement.lang=l;
  document.documentElement.dir=(l==="ar"?"rtl":"ltr");
  document.querySelectorAll("[data-i]").forEach(function(e){var v=d[e.getAttribute("data-i")];if(typeof v==="string")e.textContent=v;});
  document.getElementById("cards").innerHTML=d.cards.map(function(c){
    return '<article class="group bg-slate-900/40 border border-slate-800 rounded-2xl p-6 hover:border-indigo-500/50 hover:bg-slate-900/80 transition flex flex-col justify-between"><div><div class="flex items-start justify-between gap-2"><div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 font-bold shrink-0">'+c[0]+'</div><span class="rounded-full border border-emerald-800/60 bg-emerald-950/50 px-2.5 py-1 text-[11px] font-semibold text-emerald-300">'+esc(c[4])+'</span></div><span class="mt-4 block text-xs font-semibold text-indigo-400 uppercase tracking-wider">'+esc(c[1])+'</span><h3 class="text-xl font-bold text-white mt-1">'+esc(c[2])+'</h3><p class="mt-3 text-sm text-slate-400 leading-relaxed">'+esc(c[3])+'</p><ul class="mt-4 flex flex-wrap gap-2 text-[11px] text-slate-400">'+c[6].map(function(t){return '<li class="rounded-md border border-slate-800 bg-slate-900 px-2 py-1">'+esc(t)+'</li>'}).join("")+'</ul></div><div class="mt-6 pt-4 border-t border-slate-800/60 flex items-center justify-between text-xs text-slate-500 font-medium"><span>'+esc(d.s3)+'</span><span class="text-slate-300 font-semibold">'+esc(c[5])+'</span></div></article>';
  }).join("");
  document.getElementById("vals").innerHTML=d.vals.map(function(v){return '<li class="rounded-xl border border-slate-800 bg-slate-950/50 p-4"><p class="font-semibold text-white">'+esc(v[0])+'</p><p class="mt-1 text-slate-400">'+esc(v[1])+'</p></li>'}).join("");
  var note=(!legalTr&&l!=="en")?'<p class="rounded-lg border border-amber-800/50 bg-amber-950/30 p-3 text-amber-200/90 text-xs">This legal text is currently available in English only; the English version is the authoritative version.</p>':'';
  function body(arr){return note+arr.map(function(s){return '<div><h3 class="text-slate-200 font-semibold">'+esc(s[0])+'</h3><p class="mt-1">'+esc(s[1])+'</p></div>'}).join("")}
  document.getElementById("privBody").innerHTML=body(d.priv);
  document.getElementById("termBody").innerHTML=body(d.term);
  try{localStorage.setItem("f29lang",l)}catch(e){}
}
(function(){
  var sel=document.getElementById("lang"),saved=null;
  try{saved=localStorage.getItem("f29lang")}catch(e){}
  var nav=(navigator.language||"en").slice(0,2), init=saved||(T[nav]?nav:"en");
  sel.value=init; render(init);
  sel.addEventListener("change",function(){render(sel.value)});
  var btn=document.getElementById("navBtn"),mn=document.getElementById("mobileNav");
  btn.addEventListener("click",function(){var o=!mn.classList.toggle("hidden");btn.setAttribute("aria-expanded",String(o))});
  mn.addEventListener("click",function(e){if(e.target.tagName==="A"){mn.classList.add("hidden");btn.setAttribute("aria-expanded","false")}});
})();
</script>
